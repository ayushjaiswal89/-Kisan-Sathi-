<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Center Glow / Emblem -->
  <circle cx="256" cy="256" r="170" fill="#065f46" fill-opacity="0.5" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="140" fill="#047857" fill-opacity="0.3" />

  <!-- Plant Sprout & Wheat Stalk Elements -->
  <g filter="url(#shadow)">
    <!-- Main stem -->
    <path d="M256 380 V 190" stroke="url(#leafGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Leaves -->
    <path d="M256 310 C210 300 170 260 170 210 C210 210 245 250 256 290 Z" fill="url(#leafGrad)" />
    <path d="M256 260 C302 250 342 210 342 160 C302 160 267 200 256 240 Z" fill="url(#leafGrad)" />
    
    <!-- Top Sprout / Wheat grains -->
    <circle cx="256" cy="160" r="16" fill="url(#goldGrad)" />
    <circle cx="230" cy="130" r="14" fill="url(#goldGrad)" />
    <circle cx="282" cy="130" r="14" fill="url(#goldGrad)" />
    <circle cx="256" cy="104" r="13" fill="url(#goldGrad)" />
    
    <!-- Soil / Field furrows at bottom -->
    <path d="M160 380 Q256 405 352 380" stroke="#f59e0b" stroke-width="12" stroke-linecap="round" fill="none" />
    <path d="M185 410 Q256 430 327 410" stroke="#d97706" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.8" />
  </g>
</svg>
